name: macOS Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test Go and Swift
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
          swift test
          python3 scripts/test_templates.py
      - name: Build and Inspect
        run: |
          ./scripts/build.sh
          python3 scripts/test_app.py
          ./scripts/preview.sh
          codesign --verify --deep --strict build/NewToFile.app
